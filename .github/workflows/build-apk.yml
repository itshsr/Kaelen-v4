name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kaelen.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaelen-apk
          path: kaelen.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: KAELEN — latest APK
          body: |
            Auto-built from the latest push to main. This APK loads the live app at
            https://kaelen-v4.vercel.app — any web update (bug fixes, new features)
            appears immediately without needing a new APK, as long as the app shell
            itself (icon, name, permissions) hasn't changed.
          files: kaelen.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
